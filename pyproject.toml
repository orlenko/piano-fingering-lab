[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piano-fingering-lab"
version = "0.1.0"
description = "Local-first offline experiments extracting observed piano fingerings and synchronizing performance video with vector sheet music."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=16.0.0",
    "imageio-ffmpeg>=0.5.0",
    "moduleconf>=0.1.3",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10.0",
    "pdfplumber>=0.11.0",
    "pillow>=11.0.0",
    "pypdf>=6.0.0",
    "pypdfium2>=5.0.0",
    "reportlab>=4.0.0",
    "scipy>=1.14.0",
    "torch>=2.6.0",
    "transkun>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
piano-fingering = "piano_fingering.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_fingering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
